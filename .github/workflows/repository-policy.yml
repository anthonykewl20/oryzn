name: repository-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Enforce documentation, changelog-ownership, and issue-hygiene policy
        shell: bash
        run: |
          set -euo pipefail
          owner="${REPOSITORY%%/*}"; repo="${REPOSITORY#*/}"
          pr="$(gh api graphql -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){body labels(first:100){nodes{name}} closingIssuesReferences(first:100){nodes{number title milestone{title} labels(first:100){nodes{name}}}}}}}' -f o="$owner" -f n="$repo" -F p="$PR_NUMBER" --jq '.data.repository.pullRequest')"
          [ "$pr" != "null" ] || { echo "::error::PR metadata missing"; exit 1; }
          is_release="$(jq -r --arg l 'autorelease: pending' '.labels.nodes|any(.[];.name==$l)' <<<"$pr")"
          if [ "$is_release" = "true" ]; then echo "Release-please PR; policy exempt."; exit 0; fi
          mapfile -t files < <(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          for f in "${files[@]}"; do [ "$f" != "CHANGELOG.md" ] || { echo "::error::CHANGELOG.md is managed by release-please"; exit 1; }; done
          body="$(jq -r '.body // ""' <<<"$pr")"
          upd="$(grep -Eic '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]+Documentation updated:' <<<"$body" || true)"
          none="$(grep -Eic '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]+No documentation change is needed:' <<<"$body" || true)"
          if [ "$((upd+none))" -ne 1 ]; then echo "::error::Select exactly one documentation decision"; exit 1; fi
          has_doc=false; for f in "${files[@]}"; do case "$f" in *.md|docs/*|README|README.*) has_doc=true;; esac; done
          if [ "$upd" -eq 1 ]; then
            line="$(grep -Ei '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]+Documentation updated:' <<<"$body" | head -n1)"; val="${line#*:}"
            if [[ "$val" == *"<"* || "$val" == *"list relevant paths"* || "$has_doc" != "true" ]]; then echo "::error::'Documentation updated' selected but no concrete doc change found"; exit 1; fi
          else
            line="$(grep -Ei '^[[:space:]]*-[[:space:]]*\[[xX]\][[:space:]]+No documentation change is needed:' <<<"$body" | head -n1)"; val="${line#*:}"; val="${val#"${val%%[![:space:]]*}"}"
            if [[ "$val" == *"<"* || "${#val}" -lt 12 ]]; then echo "::error::'No documentation change' requires a concrete rationale"; exit 1; fi
          fi
          if [ "$(jq -r --arg l 'docs-needed' '.labels.nodes|any(.[];.name==$l)' <<<"$pr")" = "true" ] && [ "$upd" -ne 1 ]; then echo "::error::docs-needed label requires documentation updates"; exit 1; fi
          rows="$(jq -c '.closingIssuesReferences.nodes[]?' <<<"$pr")"
          [ -n "$rows" ] || { echo "::error::Every non-release PR must link an issue (Closes #N)"; exit 1; }
          while IFS= read -r row; do
            inum="$(jq -r '.number' <<<"$row")"
            ms="$(jq -r '.milestone.title // ""' <<<"$row")"
            [ -n "$ms" ] || { echo "::error::Issue #$inum has no milestone"; exit 1; }
            tc="$(jq -r '[.labels.nodes[].name|select(test("^type:(feature|bug|docs|infra|test|security)$"))]|length' <<<"$row")"
            [ "$tc" -eq 1 ] || { echo "::error::Issue #$inum must have exactly one approved type:* label"; exit 1; }
          done <<<"$rows"
          echo "Repository policy passed."
