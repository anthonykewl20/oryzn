name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Uses the automatic GITHUB_TOKEN. To let the release PR trigger downstream CI, create a fine-grained PAT (Contents R/W, Pull requests R/W) and add it as the RELEASE_PLEASE_TOKEN secret, then switch this to ${{ secrets.RELEASE_PLEASE_TOKEN }}.
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          include-component-in-tag: false
