name: stale

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'phase-2,security,pinned,stale-exempt,autorelease: pending'
          exempt-pr-labels: 'phase-2,security,pinned,stale-exempt,autorelease: pending'
          exempt-all-issue-milestones: true
          exempt-all-pr-milestones: true
          exempt-draft-pr: true
          operations-per-run: 30
          remove-stale-when-updated: true
          close-issue-reason: not_planned
          stale-issue-message: >
            This issue has had no activity for 30 days and is marked stale.
            Comment with the current status or next step, or remove the stale
            label. It will close in 14 days if it remains inactive. Issues in a
            milestone or labelled phase-2, security, or pinned are exempt.
          stale-pr-message: >
            This pull request has had no activity for 45 days and is marked stale.
            Comment with the current status or next step, or remove the stale
            label. It will close in 14 days if it remains inactive.
          close-issue-message: >
            Closed after remaining stale and inactive. Reopen with current context
            if the work is still required.
          close-pr-message: >
            Closed after remaining stale and inactive. Reopen with current context
            if the work is still required.
